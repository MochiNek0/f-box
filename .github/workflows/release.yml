name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build portable
        run: npm run dist:win:portable

      - name: Package exe into zip
        shell: pwsh
        run: Compress-Archive -Path release/F-Box.exe -DestinationPath release/F-Box.zip -Force

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "Changelog from $PREV_TAG to $TAG"
            RANGE="${PREV_TAG}..${TAG}"
          else
            echo "No previous tag, listing all commits up to $TAG"
            RANGE="$TAG"
          fi
          {
            echo "## 更新内容"
            echo ""
            # Drop the version-bump commit — it says nothing a user cares
            # about. `|| true` because grep exits 1 when it filters everything
            # out, and pipefail would fail the whole step on that.
            git log --no-merges --pretty=format:'- %s' "$RANGE" \
              | grep -v '^- chore' || true
            echo ""
          } > notes.md
          echo "Generated notes:"
          cat notes.md

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "F-Box" \
            --notes-file notes.md \
            release/F-Box.zip

      - name: Publish release to Cloudflare R2
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TAG="v${GITHUB_REF_NAME}"
          PREFIX="releases/${TAG}"

          cat > update.json <<EOF
          {
            "version": "${TAG}",
            "downloadUrl": "/${PREFIX}/F-Box.zip"
          }
          EOF
          echo "Generated update.json:"
          cat update.json

          npx --yes wrangler@4 r2 object put "fbox/${PREFIX}/F-Box.zip" \
            --file=release/F-Box.zip --remote --content-type=application/zip
          npx --yes wrangler@4 r2 object put "fbox/update.json" \
            --file=update.json --remote --content-type=application/json
